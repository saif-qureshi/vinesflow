name: deploy

# Builds the ARM64 backend image, pushes an immutable tag to ECR, and rolls EC2 via SSM.
# Requires (Settings -> Secrets and variables -> Actions -> Variables), from `terraform output github_actions_setup`:
#   AWS_ROLE_ARN, AWS_REGION, ECR_BACKEND, INSTANCE_ID, SSM_ENV_PARAM

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  id-token: write # OIDC
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-only@localhost:5432/vineflow
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --dev

      # E501 is pre-existing debt across ~28 files; everything else is enforced.
      - name: Lint backend
        working-directory: backend
        run: uv run ruff check --ignore E501 app tests

      - name: Test backend
        working-directory: backend
        run: uv run pytest

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            super-admin/pnpm-lock.yaml

      - name: Check the customer frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm exec next build

      - name: Check the super admin app
        working-directory: super-admin
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm exec next build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' 
    # Native ARM runner — no QEMU emulation. If unavailable on your plan,
    # revert to ubuntu-latest and re-add docker/setup-qemu-action@v3.
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vineflow_migration_check
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: migration-check-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vineflow_migration_check"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
          enable-cache: true

      - name: Verify migrations from an empty PostgreSQL database
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:migration-check-only@localhost:5432/vineflow_migration_check
        run: |
          uv sync --frozen --dev
          uv run alembic upgrade head
          uv run alembic check

      - name: Verify GitHub OIDC identity
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken("sts.amazonaws.com");
            const payload = JSON.parse(Buffer.from(token.split(".")[1], "base64url").toString());
            core.info(JSON.stringify({
              subject: payload.sub,
              audience: payload.aud,
              repository: payload.repository,
              ref: payload.ref,
              workflowRef: payload.workflow_ref,
            }));

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend (arm64)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: infra/docker/backend.Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ vars.ECR_BACKEND }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Roll the instance (pull + up via SSM)
        run: |
          set -euo pipefail
          COMPOSE_B64=$(base64 -w0 infra/docker/docker-compose.prod.yml)
          CADDY_B64=$(base64 -w0 infra/docker/Caddyfile)
          DEPLOY_B64=$(base64 -w0 infra/docker/deploy.sh)
          PARAMETERS=$(jq -nc \
            --arg compose "$COMPOSE_B64" \
            --arg caddy "$CADDY_B64" \
            --arg deploy "$DEPLOY_B64" \
            --arg sha "$GITHUB_SHA" \
            --arg ssm "${{ vars.SSM_ENV_PARAM }}" \
            '{commands: [
              "set -euo pipefail",
              "cd /opt/vineflow",
              ("echo " + $compose + " | base64 -d > docker-compose.yml.next"),
              ("echo " + $caddy + " | base64 -d > Caddyfile.next"),
              ("echo " + $deploy + " | base64 -d > deploy.sh.next"),
              "chmod 755 deploy.sh.next",
              ("./deploy.sh.next " + $sha + " " + $ssm),
              "mv deploy.sh.next deploy.sh"
            ]}')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" --output text)
          echo "SSM command: $CMD_ID"
          aws ssm wait command-executed \
            --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" || true
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" \
            --query "Status" --output text)
          echo "Deploy status: $STATUS"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" \
            --query "StandardOutputContent" --output text || true
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" \
            --query "StandardErrorContent" --output text || true
          [ "$STATUS" = "Success" ]
