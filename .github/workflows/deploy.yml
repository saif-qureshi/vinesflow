name: deploy

# Builds ARM64 images, pushes to ECR, and rolls the EC2 instance via SSM.
# Requires (Settings -> Secrets and variables -> Actions -> Variables), from `terraform output github_actions_setup`:
#   AWS_ROLE_ARN, AWS_REGION, ECR_BACKEND, ECR_FRONTEND, INSTANCE_ID

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/docker/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write # OIDC
  contents: read

jobs:
  deploy:
    # Native ARM runner — no QEMU emulation. If unavailable on your plan,
    # revert to ubuntu-latest and re-add docker/setup-qemu-action@v3.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend (arm64)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: infra/docker/backend.Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ vars.ECR_BACKEND }}:latest
            ${{ vars.ECR_BACKEND }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend (arm64)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: infra/docker/frontend.Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ vars.ECR_FRONTEND }}:latest
            ${{ vars.ECR_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Roll the instance (pull + up via SSM)
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters commands='[
              "cd /opt/vineflow",
              "/opt/vineflow/ecr-login.sh",
              "docker compose --env-file deploy.env pull",
              "docker compose --env-file deploy.env up -d --remove-orphans",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" --output text)
          echo "SSM command: $CMD_ID"
          aws ssm wait command-executed \
            --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" || true
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" \
            --query "Status" --output text)
          echo "Deploy status: $STATUS"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" \
            --query "StandardErrorContent" --output text || true
          [ "$STATUS" = "Success" ]
