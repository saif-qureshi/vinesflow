# Runs on the EC2 instance. Image URIs + immutable tag come from deploy.env;
# secrets come from backend.env and are refreshed from SSM before each deploy.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    logging: *default-logging
    depends_on:
      - backend
      - frontend

  backend:
    image: ${ECR_BACKEND}:${IMAGE_TAG}
    restart: always
    env_file:
      - backend.env
    depends_on:
      - gotenberg
    networks:
      - default
      - internal
    mem_limit: 900m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  frontend:
    image: ${ECR_FRONTEND}:${IMAGE_TAG}
    restart: always
    mem_limit: 300m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: always
    networks:
      - internal
    mem_limit: 700m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: ${ECR_BACKEND}:${IMAGE_TAG}
    restart: always
    env_file:
      - backend.env
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - internal
    mem_limit: 500m
    logging: *default-logging

  # Scheduler for periodic tasks (e.g. FBR reference sync). Enable once such tasks exist.
  # beat:
  #   image: ${ECR_BACKEND}:${IMAGE_TAG}
  #   restart: always
  #   env_file:
  #     - backend.env
  #   command: ["celery", "-A", "app.celery_app:celery_app", "beat", "--loglevel=info"]
  #   depends_on:
  #     backend:
  #       condition: service_healthy
  #   mem_limit: 200m

networks:
  internal:
    internal: true

volumes:
  caddy_data:
  caddy_config:
