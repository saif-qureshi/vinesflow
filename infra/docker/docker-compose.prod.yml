# Runs on the EC2 instance. Image URIs + tag come from deploy.env; secrets from backend.env.
services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  backend:
    image: ${ECR_BACKEND}:${IMAGE_TAG}
    restart: always
    env_file:
      - backend.env
    depends_on:
      - gotenberg
    mem_limit: 900m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/openapi.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  frontend:
    image: ${ECR_FRONTEND}:${IMAGE_TAG}
    restart: always
    mem_limit: 300m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: always
    mem_limit: 700m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Restarts any container that goes UNHEALTHY (not just crashed).
  autoheal:
    image: willfarrell/autoheal
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  worker:
    image: ${ECR_BACKEND}:${IMAGE_TAG}
    restart: always
    env_file:
      - backend.env
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 500m

  # Scheduler for periodic tasks (e.g. FBR reference sync). Enable once such tasks exist.
  # beat:
  #   image: ${ECR_BACKEND}:${IMAGE_TAG}
  #   restart: always
  #   env_file:
  #     - backend.env
  #   command: ["celery", "-A", "app.celery_app:celery_app", "beat", "--loglevel=info"]
  #   depends_on:
  #     backend:
  #       condition: service_healthy
  #   mem_limit: 200m

volumes:
  caddy_data:
  caddy_config:
