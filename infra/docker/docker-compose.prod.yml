# Runs on the EC2 instance. Image URIs + immutable tag come from deploy.env;
# secrets come from backend.env and are refreshed from SSM before each deploy.
x-logging: &default-logging
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION}
    awslogs-group: ${CLOUDWATCH_LOG_GROUP}
    awslogs-create-group: "false"

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      API_DOMAIN: ${API_DOMAIN}
    logging: *default-logging
    depends_on:
      - backend
    networks:
      - web

  migrate:
    image: ${ECR_BACKEND}:${IMAGE_TAG}
    restart: "no"
    env_file:
      - backend.env
    command: ["alembic", "upgrade", "head"]
    networks:
      - aws
    mem_limit: 256m
    logging: *default-logging

  backend:
    image: ${ECR_BACKEND}:${IMAGE_TAG}
    restart: always
    env_file:
      - backend.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      gotenberg:
        condition: service_started
    networks:
      - aws
      - web
      - internal
    mem_limit: 900m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: always
    networks:
      - internal
    mem_limit: 700m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: ${ECR_BACKEND}:${IMAGE_TAG}
    restart: always
    env_file:
      - backend.env
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aws
      - internal
    mem_limit: 500m
    logging: *default-logging

  # Scheduler for periodic tasks (e.g. FBR reference sync). Enable once such tasks exist.
  # beat:
  #   image: ${ECR_BACKEND}:${IMAGE_TAG}
  #   restart: always
  #   env_file:
  #     - backend.env
  #   command: ["celery", "-A", "app.celery_app:celery_app", "beat", "--loglevel=info"]
  #   depends_on:
  #     backend:
  #       condition: service_healthy
  #   mem_limit: 200m

networks:
  aws:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  web:
    ipam:
      config:
        - subnet: 172.29.0.0/24
  internal:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy_data:
  caddy_config:
